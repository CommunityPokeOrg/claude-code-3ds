name: Build .3dsx / .cia

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build-3dsx:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4

      - name: Build .3dsx
        run: make -j"$(nproc)"

      - name: Upload build outputs
        uses: actions/upload-artifact@v4
        with:
          name: build-outputs
          path: |
            claude-code-3ds.3dsx
            claude-code-3ds.elf
            claude-code-3ds.smdh
          if-no-files-found: error

  package-cia:
    needs: build-3dsx
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: build-outputs

      - uses: actions/checkout@v4

      - name: Download makerom
        run: |
          curl -fsSL -o /tmp/makerom.zip \
            https://github.com/3DSGuy/Project_CTR/releases/download/makerom-v0.19.0/makerom-v0.19.0-ubuntu_x86_64.zip
          unzip -o /tmp/makerom.zip -d /tmp/makerom
          chmod +x /tmp/makerom/makerom

      - name: Package .cia
        run: /tmp/makerom/makerom -f cia -o claude-code-3ds.cia \
          -rsf resources/template.rsf -target t \
          -elf claude-code-3ds.elf -icon claude-code-3ds.smdh

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: claude-code-3ds
          path: |
            claude-code-3ds.3dsx
            claude-code-3ds.cia
          if-no-files-found: error

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            claude-code-3ds.3dsx
            claude-code-3ds.cia
          generate_release_notes: true
